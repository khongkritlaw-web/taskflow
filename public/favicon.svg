<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background with smooth squircle -->
  <rect width="512" height="512" rx="128" fill="url(#appGrad)"/>
  
  <!-- Subtle inner glass glow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Main Symbol: Document & Checkmark -->
  <g filter="url(#dropShadow)">
    <!-- Main Card Body -->
    <rect x="110" y="96" width="292" height="320" rx="36" fill="#ffffff"/>
    
    <!-- Top accent bar -->
    <path d="M 110 132 C 110 112 126 96 146 96 L 366 96 C 386 96 402 112 402 132 L 402 156 L 110 156 Z" fill="url(#glowGrad)"/>
    
    <!-- Task Row 1 with completed checkmark -->
    <circle cx="165" cy="210" r="20" fill="#10b981"/>
    <path d="M 156 210 L 163 217 L 176 203" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="202" y="202" width="155" height="16" rx="8" fill="#e2e8f0"/>
    
    <!-- Task Row 2 with completed checkmark -->
    <circle cx="165" cy="272" r="20" fill="#6366f1"/>
    <path d="M 156 272 L 163 279 L 176 265" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="202" y="264" width="130" height="16" rx="8" fill="#e2e8f0"/>
    
    <!-- Task Row 3 with clock/pending -->
    <circle cx="165" cy="334" r="20" fill="#f59e0b"/>
    <path d="M 165 324 L 165 334 L 173 338" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="202" y="326" width="105" height="16" rx="8" fill="#e2e8f0"/>
  </g>
  
  <!-- Corner Floating Badge -->
  <circle cx="392" cy="120" r="32" fill="#ec4899" filter="url(#dropShadow)"/>
  <path d="M 392 106 L 396 116 L 406 120 L 396 124 L 392 134 L 388 124 L 378 120 L 388 116 Z" fill="#ffffff"/>
</svg>
